<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ship a Package</title>
  <link rel="stylesheet" href="styles.css">
</head>
<!--A page entirely dedicated to handling would be orders for the company to ship-->
<div id="header">
    <h1>Want to ship something? Look no further!</h1>
</div>

<nav>
  <ul class="navbar">
    <li><a href="index.html">Home</a></li>
    <li><a href="maps.html">Locations</a></li>
    <li><a href="about.html">About Us</a></li>
    <li><a href="shipping request.html">Ship a Package</a></li>
  </ul>
</nav>

<form action="shipping request.html" target="_self" method="GET">
    <p>
        <label for="name">Name</label>
        <input type="text" id="name" name="fullname" required>
   </p>
   <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
   </p>
   <p>
        <label for="location">Shipping Center</label>
        <select id="location" name="location" required>
            <option>Geer Shipping Center</option>
            <option>Lockwood Logistics</option>
            <option>Eastern Shores Distribution</option>
            <option>Northen Mountain Mail</option>
            <option>Swiss Shippers</option>
            <option>Mozambique Tumbling</option>
            <option>Port Selene</option>
        </select>
   </p>
   <p>
        <label>Destination Address</label>
   </p>
   <p>
        <label for="country">Country</label>
        <input type="text" for="country" id="country" name="country" required>
   </p>
   <p>
        <label for="straddr">Street Address</label>
        <input type="text" for="straddr" id="straddr" name="straddr" required>
   </p>
   <p>
        <label for="state">State/Province/Region</label>
        <input type="text" for="state" id="state" name="state" required>
   </p>
   <p>
        <label for="city">City</label>
        <input type="text" for="city" id="city" name="city" required>
   </p>
   <p>
        <label for="zip">Zip/Postal Code</label>
        <input type="text" for="zip" id="zip" name="zip" required>
   </p>
   <input type="submit">
</form>


</html>
